spring.application.name=Second Brain Server

# JWT Settings
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=86400000

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/secondbrain_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false

# Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models/
gemini.api.model=gemini-3.5-flash

# AI Chat Settings
ai.chat.daily-message-limit=${AI_DAILY_LIMIT:3}

# Daily task generation — skip a domain if it already has this many open (TODO/IN_PROGRESS) tasks
tasks.generation.max-per-domain=${MAX_TASKS_PER_DOMAIN:5}

# YouTube Data API (for task resource links)
youtube.api.key=${YOUTUBE_API_KEY:}

# Resend (transactional email — password reset)
resend.api.key=${RESEND_API_KEY:}
mail.from=${MAIL_FROM:onboarding@resend.dev}

# OTP policy (shared by password reset + email verification)
auth.otp.expiry-ms=${AUTH_OTP_EXPIRY_MS:1800000}
auth.otp.max-requests=${AUTH_OTP_MAX_REQUESTS:5}
auth.otp.request-window-hours=${AUTH_OTP_WINDOW_HOURS:12}
auth.otp.max-attempts=${AUTH_OTP_MAX_ATTEMPTS:10}