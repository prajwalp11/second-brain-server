spring.application.name=Second Brain Server

# JWT Settings
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=86400000

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/secondbrain_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false

# Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models/
gemini.api.model=gemini-3.5-flash

# AI Chat Settings
ai.chat.daily-message-limit=${AI_DAILY_LIMIT:3}
